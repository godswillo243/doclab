services:
  postgres:
    image: postgres:18
    container_name: doclab-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: doclab_user
      POSTGRES_PASSWORD: doclab_password
      POSTGRES_DB: doclab_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
